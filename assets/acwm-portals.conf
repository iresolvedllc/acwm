[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
# acwm-portal handles screenshots natively; wlr is the fallback
org.freedesktop.impl.portal.Screenshot=acwm;wlr;
# oo7 secret portal (install oo7 0.6.0 or newer; see docs/configuration/secrets)
org.freedesktop.impl.portal.Secret=oo7;gnome-keyring;
org.freedesktop.impl.portal.Inhibit=none
